<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <symbol id="x" width="100" height="100" overflow="visible">
    <style media="screen">@media (min-width: 0px) { #imported_tile[data-kind="{tile}"] &gt; rect { fill: url(#imported_paint); } }</style>
    <defs>
      <linearGradient id="imported_paint">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </linearGradient>
      <linearGradient id="imported_outline">
        <stop offset="0" stop-color="yellow"/>
        <stop offset="1" stop-color="lime"/>
      </linearGradient>
      <g id="imported_tile" data-kind="{tile}">
        <rect x="2" y="2" width="96" height="96" stroke="url(#imported_outline)" stroke-width="4"/>
      </g>
    </defs>
    <use href="#imported_tile"/>
    <text x="4" y="90" font-size="14" fill="white">url(#paint)</text>
  </symbol>
  <use xlink:href="#x" x="0" y="0"/>
</svg>