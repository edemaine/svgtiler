<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 10 10" width="10" height="10" xmlns="http://www.w3.org/2000/svg">
  <symbol id="x" width="10" height="10" overflow="visible">
    <style media="screen">@media (min-width: 0px) { [data-kind="{tile}"] &gt; rect { fill: red; } }</style>
    <g data-kind="{tile}">
      <rect width="10" height="10"/>
    </g>
  </symbol>
  <use xlink:href="#x" x="0" y="0"/>
</svg>